[package]
name = "arinsal-http-rust"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[profile.release]
lto = "fat"
codegen-units = 1
