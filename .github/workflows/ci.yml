name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust and OTP tests
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          version-type: strict

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run Rust checks and tests
        run: tools/check.sh

      - name: Check difftest protocol against OTP
        run: tools/difftest/smoke.sh

      - name: Compare VM stage1 cases with OTP
        run: cargo run -p difftest-runner --bin difftest -- --vm arinsal --suite stage1

  language-interop:
    name: Gleam interoperability
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          gleam-version: "1.9.0"
          version-type: strict
          install-hex: true
          install-rebar: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build Gleam smoke fixture
        working-directory: tests/languages/gleam
        run: gleam build

      - name: Run Gleam-generated BEAM code on Arinsal
        shell: bash
        run: |
          beam_dir="$(find tests/languages/gleam/build/dev/erlang -type d -name ebin -print -quit)"
          test -n "$beam_dir"
          result="$(target/release/arinsal eval -pa "$beam_dir" arinsal_gleam_smoke answer)"
          grep -Fxq '42' <<< "$result"
