[package]
name = "arinsal_erts_etc"
description = "Rust ports of the standalone erts/etc programs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }

libc = "0.2.189"

[build-dependencies]
cc = "1.2.38"

[dev-dependencies]
similar-asserts = "2"

[[bin]]
name = "arinsal_erlc"
path = "src/bin/erlc.rs"

[[bin]]
name = "arinsal_escript"
path = "src/bin/escript.rs"

[[bin]]
name = "arinsal_ct_run"
path = "src/bin/ct_run.rs"

[[bin]]
name = "arinsal_dialyzer"
path = "src/bin/dialyzer.rs"

[[bin]]
name = "arinsal_typer"
path = "src/bin/typer.rs"

[[bin]]
name = "arinsal_erl_call"
path = "src/bin/erl_call.rs"

[[bin]]
name = "arinsal_heart"
path = "src/bin/heart.rs"

[[bin]]
name = "arinsal_run_erl"
path = "src/bin/run_erl.rs"

[[bin]]
name = "arinsal_to_erl"
path = "src/bin/to_erl.rs"
