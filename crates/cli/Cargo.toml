[package]
name = "arinsal-cli"
description = "The arinsal binary (erl replacement)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
instr-count = ["arinsal-vm/instr-count"]

[dependencies]
arinsal-alloc = { path = "../alloc" }
arinsal-args.workspace = true
arinsal-beam.workspace = true
arinsal-etf.workspace = true
arinsal-term.workspace = true
arinsal-vm.workspace = true
arinsal-float.workspace = true
arinsal-nif.workspace = true
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
arinsal-difftest.workspace = true
similar-asserts = "2"

[[bin]]
name = "arinsal"
path = "src/main.rs"
