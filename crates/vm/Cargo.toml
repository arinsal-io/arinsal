[package]
name = "arinsal-vm"
description = "The Arinsal interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
instr-count = []
difftest = ["dep:arinsal-difftest"]
validate-terms = ["arinsal-term/validate-terms"]
pf-mem-counters = []

[dependencies]
arinsal-alloc = { path = "../alloc" }
arinsal-spec.workspace = true
arinsal-beam.workspace = true
arinsal-etf.workspace = true
arinsal-ets.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
arinsal-term.workspace = true
arinsal-args.workspace = true
arinsal-arith.workspace = true
arinsal-maps.workspace = true
arinsal-bits.workspace = true
arinsal-bifs.workspace = true
arinsal-re.workspace = true
arinsal-nif.workspace = true
arinsal-drv.workspace = true
arinsal-nif-file.workspace = true
arinsal-nif-buffer.workspace = true
arinsal-nif-zlib.workspace = true
arinsal-nif-tty.workspace = true
arinsal-nif-socket.workspace = true
arinsal-pterm.workspace = true
arinsal-float.workspace = true
arinsal-loader.workspace = true
arinsal-beamasm = { path = "../beamasm" }
arinsal-a64 = { path = "../a64" }
arinsal-beamjit = { path = "../beamjit" }
arinsal-sched.workspace = true
arinsal-packet.workspace = true
smallvec = "1.15.1"
arinsal-difftest = { workspace = true, optional = true }
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs", "net", "pipe", "process", "stdio"] }
mio = { version = "1", features = ["os-poll", "os-ext"] }
signal-hook-mio = { version = "0.2.5", features = ["support-v1_0"] }
nix = { version = "0.29.0", features = ["fs", "net"] }
arc-swap = "1.9.2"
parking_lot = "0.12.5"

[dev-dependencies]
arinsal-beamjit = { path = "../beamjit" }
arinsal-difftest.workspace = true
arinsal-etf.workspace = true
arinsal-pterm.workspace = true
libc = "0.2"
similar-asserts = "2"
socket2 = { version = "0.6.5", features = ["all"] }
