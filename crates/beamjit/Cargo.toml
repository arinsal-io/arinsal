[package]
name = "arinsal-beamjit"
description = "Function-level BEAM to BeamAsm native compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
arinsal-beam.workspace = true
arinsal-term.workspace = true
arinsal-beamops = { path = "../beamops" }
arinsal-etf.workspace = true
arinsal-beamasm = { path = "../beamasm" }
arinsal-a64 = { path = "../a64" }
arinsal-x64 = { path = "../x64" }
thiserror.workspace = true
smallvec = "1.15.1"

[build-dependencies]
arinsal-beamops = { path = "../beamops" }

[dev-dependencies]
arinsal-spec.workspace = true
similar-asserts = "2"
arinsal-beamasm = { path = "../beamasm", features = ["test-runtime-stubs"] }
